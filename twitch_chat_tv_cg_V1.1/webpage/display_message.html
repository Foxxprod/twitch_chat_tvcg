<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Message Central</title>
<style>
body {
    background: rgba(0,0,0,0);
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
#central {
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%) translateY(100px);
    color: white;
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    display: none;
    padding: 30px 60px;
    background: rgba(0,0,0,0.8);
    border-radius: 20px;
    max-width: 90%;
    word-wrap: break-word;
    transition: transform 0.8s ease-in, opacity 0.8s ease-in;
    opacity: 0;
}
#central.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}
#central.hide {
    transform: translateX(-50%) translateY(100px);
    opacity: 0;
}
</style>
</head>
<body>
<div id="central"></div>

<script>
// ------------------------
// Couleur random pseudo
// ------------------------
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for(let i=0; i<6; i++){
        color += letters[Math.floor(Math.random()*16)];
    }
    return color;
}

// ------------------------
// Animation message central
// ------------------------
const central = document.getElementById("central");

// ------------------------
// WebSocket avec reconnexion auto
// ------------------------
let ws;
let reconnectDelay = 2000; // 2 secondes

function connectWebSocket() {
    ws = new WebSocket("ws://localhost:6789");
    console.log("Connexion au WebSocket...");

    ws.onopen = () => {
        console.log("Connecté au serveur !");
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.central && data.user && data.msg) {
            const userColor = getRandomColor();
            central.innerHTML = `<b style="color:${userColor}">${data.user}</b>: <span style="color:white">${data.msg}</span>`;
            central.style.display = "block";
            central.classList.remove("hide");

            console.log(data);
            // petit délai pour déclencher l'animation
            setTimeout(() => {
                central.classList.add("show");
            }, 10);

        } else {
            console.log("supression du message")
            central.classList.remove("show");
            central.classList.add("hide");
            setTimeout(() => { central.style.display = "none"; }, 800);
        }
    };

    ws.onclose = () => {
        console.warn("Connexion perdue. Tentative de reconnexion...");
        scheduleReconnect();
    };

    ws.onerror = () => {
        console.error("Erreur WebSocket. Nouvelle tentative...");
        ws.close();
    };
}

// ------------------------
// Gestion de la reconnexion
// ------------------------
function scheduleReconnect() {
    setTimeout(() => {
        console.log("Tentative de reconnexion...");
        connectWebSocket();
    }, reconnectDelay);
}

// Lancer la connexion au chargement
connectWebSocket();
</script>
</body>
</html>
